spring.application.name=AlbionDiscordBot

# No web server: RestClient comes from spring-boot-starter-restclient, not -web.
# keep-alive is what holds the JVM open, since there is no servlet container to do it.
spring.main.web-application-type=none
spring.main.keep-alive=true

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:albionbot}
spring.datasource.username=${POSTGRES_USER:albionbot}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema. Never 'update' — this database holds silver balances,
# and entity drift silently mutating money tables is not acceptable.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

bot.token=${BOT_TOKEN}

albion.api.base-url=https://gameinfo-ams.albiononline.com/api/gameinfo
# Cloudflare fronts the Albion API and rejects default Java user agents with 403.
albion.api.user-agent=Mozilla/5.0 (compatible; AlbionDiscordBot/1.0)
albion.api.min-request-interval=500ms
albion.api.connect-timeout=5s
albion.api.read-timeout=20s

albion.poller.enabled=true
albion.poller.interval=2m
# Each run pages back to (last success - overlap), so a normal poll costs 2-3 requests
# and a poll after downtime digs as deep as the gap requires. Battles are dense —
# ~560 of them span under 2 hours on EU — so a fixed window would be either wasteful
# or too shallow.
albion.poller.overlap=20m
albion.poller.cold-start-lookback=6h
albion.poller.finalize-grace=200s
# Safety valve only; the time horizon normally stops paging first. 200 pages is enough
# to crawl a full day, which is as far back as range=day can see anyway.
albion.poller.max-pages=200

logging.level.personal.albiondiscordbot=INFO
logging.level.net.dv8tion.jda=WARN
