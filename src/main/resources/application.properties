spring.application.name=AlbionDiscordBot

# No web server: RestClient comes from spring-boot-starter-restclient, not -web.
# keep-alive is what holds the JVM open, since there is no servlet container to do it.
spring.main.web-application-type=none
spring.main.keep-alive=true

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:albionbot}
spring.datasource.username=${POSTGRES_USER:albionbot}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema. Never 'update' — this database holds silver balances,
# and entity drift silently mutating money tables is not acceptable.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

bot.token=${BOT_TOKEN}

albion.api.base-url=https://gameinfo-ams.albiononline.com/api/gameinfo
# Where killboard posts link to. Region-scoped: the subdomain must match the server
# the guild plays on, or every link 404s. %d is the battle id.
albion.battle-url-template=https://europe.albionbb.com/battles/%d
# Cloudflare fronts the Albion API and rejects default Java user agents with 403.
albion.api.user-agent=Mozilla/5.0 (compatible; AlbionDiscordBot/1.0)
albion.api.min-request-interval=500ms
albion.api.connect-timeout=5s
albion.api.read-timeout=20s
# The API serves from a shared cache (max-age=600 on players/search, 300 on battles) and
# was measured serving battle pages EIGHT HOURS stale. That made /register report an old
# guild and made the poller stop paging early and lose battles for good. A unique
# throwaway query parameter is the only thing that misses the cache; a no-cache request
# header does nothing. See AlbionApiClient. Turn off only if the API objects to the load.
albion.api.bypass-cache=true

albion.poller.enabled=true
# A battle cannot be posted until it finalizes, ~180s after its last kill, so this
# interval is the only part of the delay the bot controls. At 1m a killboard lands
# within ~4 minutes of the fight ending instead of ~5, and a run costs 3 requests, so
# the poller sits around 3 requests/minute — far under what the rate limiter allows.
albion.poller.interval=1m
# Each run pages back to (last success - overlap), so a normal poll costs 2-3 requests
# and a poll after downtime digs as deep as the gap requires. Battles are dense —
# ~560 of them span under 2 hours on EU — so a fixed window would be either wasteful
# or too shallow.
#
# This is a safety margin, not the thing that makes deferred battles reachable: a
# battle that is still accruing when a run sees it is remembered by start time in
# poller_state.oldest_open_battle_at, and the next run pages back to it however deep
# that turns out to be. Raising this number is not the fix if battles go missing.
albion.poller.overlap=20m
albion.poller.cold-start-lookback=6h
albion.poller.finalize-grace=200s
# Safety valve only; the time horizon normally stops paging first. 200 pages is enough
# to crawl a full day, which is as far back as range=day can see anyway.
albion.poller.max-pages=200

logging.level.personal.albiondiscordbot=INFO
logging.level.net.dv8tion.jda=WARN

# Registrations are only verified at /register time, so without this a member who
# leaves the guild months later stays "verified" forever. Works through the roster
# oldest-check-first, a batch at a time, so a big guild is refreshed continuously
# without any single run blocking interactive commands.
albion.revalidation.enabled=true
albion.revalidation.interval=30m
albion.revalidation.stale-after=6h
albion.revalidation.batch-size=40
